spring:
  application:
    name: campusflow
  
  # Database Configuration with Supabase
  datasource:
    url: jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require
    username: postgres.utjdyyhbhzqogpazbqtb
    password: Tharu@21247
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      validation-timeout: 5000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        '[format_sql]': true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        '[jdbc.lob.non_contextual_creation]': true
        '[default_schema]': public
    open-in-view: false
    show-sql: false

  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false
    out-of-order: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
      enabled: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          '[starttls.enable]': true
          '[starttls.required]': true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 1033050265886-d524ltn2c4241s95f37o8a6gc290hn2e.apps.googleusercontent.com
            client-secret: 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
            scope: email,profile
            redirect-uri: http://localhost:8080/login/oauth2/code/google
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://www.googleapis.com/oauth2/v2/token
            user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
            user-name-attribute: email

logging:
  level:
    root: INFO
    '[com.sliit.campusflow]': DEBUG
    '[org.springframework.security]': INFO
    '[org.hibernate.SQL]': WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,env
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

app:
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5175}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: 900000
    issuer: campusflow
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:5175}

# Supabase specific configuration
supabase:
  api-url: ${SUPABASE_API_URL:}
  anon-key: ${SUPABASE_ANON_KEY:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  jwks-url: ${SUPABASE_JWKS_URL:}