spring:
  datasource:
    url: jdbc:h2:mem:campusflow_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        "[format_sql]": true
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 2525
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            redirect-uri: http://localhost/login/oauth2/code/google

app:
  jwt:
    secret: test-secret-key-test-secret-key-123456
    expiration: 900000
